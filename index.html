<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ankimo — 你的 Anki 笔记流</title>
  <meta name="description" content="Ankimo：把快速记录与 Anki 记忆连接起来">
  <link rel="stylesheet" href="style.css">
</head>

<body><!--
THESIS: tag-first capture stream; refuse dashboard tiles and repeated card boxes.
OWN-WORLD: paper-white, graphite, muted gray, one botanical green; hairline dividers, near-zero elevation, calm Chinese workhorse type.
STORY: see local Anki status, choose short note or Q&A with consequence, tag and save, then read result in stream.
FIRST VIEWPORT: quiet 248px rail; slim utility bar; dominant edge-to-edge composer; chronological stream below.
FORM: approved tag-flow composition refined by composer-led focus; seed key 16d74762.
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
-->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h1 class="logo"><span class="logo-mark" aria-hidden="true">A</span><span>Ankimo</span></h1>
    </div>

    <nav class="sidebar-nav" aria-label="主导航">
      <button class="nav-item active" id="navAll" data-filter="all" type="button">
        <span class="nav-icon nav-icon-notes" aria-hidden="true"></span><span>全部笔记</span>
      </button>
      <button class="nav-item" id="navDaily" data-filter="is:due" type="button">
        <span class="nav-icon nav-icon-review" aria-hidden="true"></span><span>每日回顾</span>
      </button>
    </nav>

    <div class="sidebar-section tags-section">
      <button class="section-header" id="tagHeader" type="button" aria-controls="tagContent" aria-expanded="true">
        <span class="section-title">标签</span>
        <span class="section-toggle" aria-hidden="true"><svg viewBox="0 0 12 7" width="12" height="7" focusable="false"><path d="M1 1l5 5 5-5" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.25" /></svg></span>
      </button>
      <div id="tagContent">
        <div class="tag-search-box">
          <input type="text" id="tagSearchInput" placeholder="搜索标签..." aria-label="搜索标签">
        </div>
        <div class="pinned-tags" id="pinnedTags"></div>
        <button class="more-tags-toggle" id="moreTagsToggle" type="button" aria-controls="tagTree" aria-expanded="true">
          <span>收起标签</span>
          <span class="more-tags-count" id="moreTagsCount"></span>
        </button>
        <div class="tag-tree" id="tagTree"></div>
      </div>
    </div>

    <div class="sidebar-section flags-section">
      <button class="section-header collapsed" id="flagHeader" type="button" aria-controls="flagList" aria-expanded="false">
        <span class="section-title"><span class="section-mark flag-mark" aria-hidden="true"></span> 旗标</span>
        <span class="section-toggle" aria-hidden="true"><svg viewBox="0 0 12 7" width="12" height="7" focusable="false"><path d="M1 1l5 5 5-5" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.25" /></svg></span>
      </button>
      <div class="flag-list" id="flagList" style="display:none">
        <button class="flag-item" data-flag="1" type="button"><span class="flag-dot flag-red" aria-hidden="true"></span><span>红旗</span></button>
        <button class="flag-item" data-flag="2" type="button"><span class="flag-dot flag-orange" aria-hidden="true"></span><span>橙旗</span></button>
        <button class="flag-item" data-flag="3" type="button"><span class="flag-dot flag-green" aria-hidden="true"></span><span>绿旗</span></button>
      </div>
    </div>

    <div class="sidebar-section deck-section">
      <button class="section-header collapsed" id="deckHeader" type="button" aria-controls="deckList" aria-expanded="false">
        <span class="section-title"><span class="section-mark deck-mark" aria-hidden="true"></span> 牌组</span>
        <span class="section-toggle" aria-hidden="true"><svg viewBox="0 0 12 7" width="12" height="7" focusable="false"><path d="M1 1l5 5 5-5" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.25" /></svg></span>
      </button>
      <div class="deck-list" id="deckList" style="display:none"></div>
    </div>

    <section class="stats-card" id="statsCard" aria-labelledby="statsTitle">
      <h2 class="stats-title" id="statsTitle">复习概览</h2>
      <div class="stats-row">
        <div class="stat-item"><span class="stat-num" id="statNotes">—</span><span class="stat-label">笔记</span></div>
        <div class="stat-item"><span class="stat-num" id="statTags">—</span><span class="stat-label">标签</span></div>
        <div class="stat-item"><span class="stat-num" id="statReviewed">—</span><span class="stat-label">今日复习</span></div>
      </div>
      <div class="heatmap-container" id="heatmap" role="group" aria-label="最近十二周复习热力图"></div>
      <div class="review-stats" id="reviewStats">
        <div class="review-stat-item">
          <span class="review-stat-icon" aria-hidden="true"></span>
          <div class="review-stat-info">
            <span class="review-stat-value" id="statDailyAvg">—</span>
            <span class="review-stat-desc">日均复习</span>
          </div>
        </div>
        <div class="review-stat-item">
          <span class="review-stat-icon" aria-hidden="true"></span>
          <div class="review-stat-info">
            <span class="review-stat-value" id="statDaysLearned">—</span>
            <span class="review-stat-desc">学习天数</span>
          </div>
        </div>
        <div class="review-stat-item">
          <span class="review-stat-icon" aria-hidden="true"></span>
          <div class="review-stat-info">
            <span class="review-stat-value" id="statCurrentStreak">—</span>
            <span class="review-stat-desc">当前连续</span>
          </div>
        </div>
        <div class="review-stat-item">
          <span class="review-stat-icon" aria-hidden="true"></span>
          <div class="review-stat-info">
            <span class="review-stat-value" id="statLongestStreak">—</span>
            <span class="review-stat-desc">最长连续</span>
          </div>
        </div>
      </div>
    </section>
  </aside>

  <main class="main-content">
    <header class="top-bar">
      <button class="menu-btn" id="menuBtn" type="button" aria-label="打开侧栏" aria-controls="sidebar" aria-expanded="false"><svg viewBox="0 0 16 12" width="16" height="12" aria-hidden="true" focusable="false"><path d="M1 1h14M1 6h14M1 11h14" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="1.5" /></svg></button>
      <button class="search-toggle" id="searchToggle" type="button" aria-label="打开搜索" aria-controls="searchBox" aria-expanded="false">搜索</button>
      <div class="search-box" id="searchBox">
        <span class="search-icon" aria-hidden="true"></span>
        <input type="text" id="searchInput" placeholder="搜索笔记... 支持 Anki 搜索语法" aria-label="搜索笔记">
        <button class="search-close" id="searchClose" type="button" aria-label="关闭搜索"><svg viewBox="0 0 14 14" width="14" height="14" aria-hidden="true" focusable="false"><path d="M2 2l10 10M12 2L2 12" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="1.5" /></svg></button>
      </div>
      <div class="connection-status" id="connectionStatus" role="status" aria-live="polite" aria-label="AnkiConnect 连接状态">
        <span id="connectionStatusText">连接到本地 Anki</span>
      </div>
      <button class="blur-toggle-btn active" id="blurToggleBtn" type="button" title="切换答案显示">答案</button>
      <button class="sync-btn" id="syncBtn" type="button" title="同步 Anki">同步</button>
    </header>

    <div class="content-area" id="contentArea">
      <div class="content-column">
        <section class="input-card" id="inputCard" aria-labelledby="composerTitle">
          <input class="mode-radio visually-hidden" type="radio" name="noteMode" id="noteModeMemo" value="memo" aria-describedby="modeDescription" checked>
          <input class="mode-radio visually-hidden" type="radio" name="noteMode" id="noteModeQa" value="qa" aria-describedby="modeDescription">
          <input class="advanced-check visually-hidden" type="checkbox" id="advancedToggle">

          <div class="composer-head">
            <div>
              <h2 id="composerTitle">快速记录</h2>
            </div>
            <div class="mode-switch" role="group" aria-label="笔记类型" aria-describedby="modeDescription">
              <label class="mode-label" for="noteModeMemo">短笔记</label>
              <label class="mode-label" for="noteModeQa">问答卡</label>
            </div>
          </div>
          <p class="composer-hint" id="modeDescription">短笔记不会进入日常复习；问答卡会正常参与复习。</p>

          <div class="composer-fields">
            <label class="visually-hidden" for="frontInput">内容或问题</label>
            <textarea id="frontInput" placeholder="写下此刻的想法、摘录或待整理内容..." rows="4" aria-describedby="modeDescription"></textarea>
            <label class="visually-hidden" for="backInput">答案或补充内容</label>
            <textarea id="backInput" placeholder="答案 / 补充内容..." rows="4" aria-describedby="modeDescription"></textarea>
          </div>

          <div class="composer-footer">
            <label class="tag-input-wrap" for="tagInput">
              <span class="visually-hidden">标签</span>
              <input type="text" id="tagInput" placeholder="添加标签，空格分隔" autocomplete="off">
            </label>
            <div class="composer-actions">
              <label class="advanced-toggle" for="advancedToggle">
                <span>高级设置</span><span class="advanced-chevron" aria-hidden="true"><svg viewBox="0 0 12 7" width="12" height="7" focusable="false"><path d="M1 1l5 5 5-5" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.25" /></svg></span>
              </label>
              <button class="save-btn" id="saveBtn" type="button">保存</button>
            </div>
          </div>

          <div class="advanced-controls" id="advancedControls">
            <label class="control-field">
              <span>牌组</span>
              <select id="deckSelect">
                <option>加载中...</option>
              </select>
            </label>
            <label class="control-field">
              <span>模板</span>
              <select id="modelSelect">
                <option>加载中...</option>
              </select>
            </label>
          </div>
        </section>

        <div class="filter-info" id="filterInfo" style="display:none">
          <span class="filter-dot" aria-hidden="true"></span>
          <span id="filterText"></span>
          <button class="clear-filter" id="clearFilter" type="button">清除筛选</button>
        </div>

        <section class="stream-region" aria-labelledby="streamHeading">
          <div class="stream-header">
            <h2 id="streamHeading">全部笔记</h2>
            <span id="streamCount" aria-live="polite"></span>
          </div>
          <div class="notes-list" id="notesList"></div>
        </section>
        <div class="loading" id="loading" style="display:none">
          <div class="spinner"></div><span>加载中...</span>
        </div>
        <div class="empty-state" id="emptyState" style="display:none">
          <span class="empty-icon" aria-hidden="true"></span>
          <p>还没有找到笔记</p>
          <span>从上面的输入框开始记录。</span>
        </div>
      </div>
    </div>
  </main>

  <div class="overlay" id="overlay"></div>

  <div class="edit-modal-overlay" id="editModalOverlay" style="display:none">
    <div class="edit-modal" role="dialog" aria-modal="true" aria-labelledby="editModalTitle">
      <div class="edit-modal-header">
        <h3 id="editModalTitle">编辑笔记</h3>
        <div class="edit-modal-meta" id="editModalMeta"></div>
      </div>
      <div class="edit-modal-body" id="editModalBody"></div>
      <div class="edit-modal-tags">
        <label for="editTagsInput">标签 <span class="edit-tags-hint">（空格分隔）</span></label>
        <input type="text" id="editTagsInput" placeholder="标签1 标签2 ...">
      </div>
      <div class="edit-modal-actions">
        <button class="edit-modal-cancel" id="editModalCancel" type="button">取消</button>
        <button class="edit-modal-save" id="editModalSave" type="button">保存</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>

</html>
